<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Страница не найдена</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(0, 80, 180, 0.18), transparent 35%),
        radial-gradient(circle at bottom, rgba(0, 120, 255, 0.12), transparent 40%),
        #02060d;
      color: #eaf4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .background-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .background-glow::before,
    .background-glow::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
    }

    .background-glow::before {
      top: 8%;
      left: 10%;
      background: #0b6cff;
    }

    .background-glow::after {
      right: 8%;
      bottom: 10%;
      background: #00aaff;
    }

    .error-card {
      position: relative;
      z-index: 2;
      width: min(90%, 720px);
      padding: 48px 36px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(5, 14, 28, 0.96), rgba(2, 8, 18, 0.96));
      border: 1px solid rgba(50, 130, 255, 0.25);
      box-shadow:
        0 0 0 1px rgba(0, 120, 255, 0.08),
        0 0 30px rgba(0, 80, 255, 0.18),
        inset 0 0 24px rgba(0, 110, 255, 0.05);
      text-align: center;
    }

    .status {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(76, 163, 255, 0.28);
      background: rgba(7, 22, 45, 0.8);
      color: #8ec8ff;
      font-size: 14px;
      box-shadow: 0 0 12px rgba(0, 123, 255, 0.12);
    }

    .code {
      font-size: clamp(72px, 14vw, 140px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 4px;
      color: #dff1ff;
      text-shadow:
        0 0 12px rgba(70, 160, 255, 0.35),
        0 0 28px rgba(0, 110, 255, 0.18);
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(24px, 4vw, 34px);
      margin-bottom: 14px;
      color: #ffffff;
    }

    p {
      max-width: 560px;
      margin: 0 auto 28px;
      color: #8ca3bd;
      font-size: 16px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: 0.25s ease;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0d6efd, #0a58ca);
      color: white;
      box-shadow: 0 0 18px rgba(13, 110, 253, 0.28);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 26px rgba(13, 110, 253, 0.4);
    }

    .btn-secondary {
      background: rgba(8, 20, 38, 0.95);
      border-color: rgba(67, 143, 255, 0.25);
      color: #9fd0ff;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      border-color: rgba(67, 143, 255, 0.45);
      box-shadow: 0 0 18px rgba(0, 110, 255, 0.14);
    }

    .bottom-text {
      margin-top: 22px;
      font-size: 13px;
      color: #5f7691;
    }

    @media (max-width: 600px) {
      .error-card {
        padding: 36px 22px;
        border-radius: 20px;
      }

      p {
        font-size: 15px;
      }

      .btn {
        width: 100%;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>

  <div class="error-card">
    <div class="status">Системное уведомление</div>
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>
      Похоже, этот маршрут не существует или был перемещён.
      Попробуй вернуться назад или перейти на главную страницу мессенджера.
    </p>

    <div class="actions">
      <a href="/" class="btn btn-primary">На главную</a>
      <a href="javascript:history.back()" class="btn btn-secondary">Назад</a>
    </div>

    <div class="bottom-text">
      ASTRAX • connection lost
    </div>
  </div>
</body>
</html>
