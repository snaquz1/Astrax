<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WS demo</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
    #log { border: 1px solid #ccc; padding: 12px; height: 250px; overflow: auto; }
    .row { display:flex; gap: 8px; margin-top: 10px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 14px; }
  </style>
</head>
<body>
  <h2>WebSocket ping/pong demo</h2>

  <div id="log"></div>

  <div class="row">
    <input id="msg" placeholder="Напиши что-нибудь..." />
    <button id="send">Send</button>
      <button id="close">close connection</button>
  </div>

  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("msg");
    const btn = document.getElementById("send");
    const close = document.getElementById("close");

    function addLine(text) {
      const div = document.createElement("div");
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    // ws или wss (если сайт на https)
    const scheme = (location.protocol === "https:") ? "wss" : "ws";

    // создаём соединение
    const socket = new WebSocket(`${scheme}://${location.host}/ws/ping/`);
    
    socket.onopen = () => addLine("WS open ✅");
    socket.onclose = () => addLine("WS closed ❌");
    socket.onerror = () => addLine("WS error ❌");

    // сервер прислал сообщение
    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      addLine(`${data.message}`);
    };

    // отправка
    btn.onclick = () => {
      const text = input.value.trim();
      if (!text) return;
      socket.send(JSON.stringify({ message: text }));
      addLine(`${text}`);
      input.value = "";
      input.focus();
    };
    
    close.onclick = () => {
        socket.close();
        addLine("interrupted by user💀");
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") btn.click();
    });
  </script>
</body>
</html>
