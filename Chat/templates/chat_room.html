{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>chat_room</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; }
    #log { border: 1px solid #ccc; padding: 12px; height: 250px; overflow: auto; }
    .row { display:flex; gap: 8px; margin-top: 10px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 14px; }
  </style>
</head>
<body>
  <h2>chat room {{ chat_id }}</h2>

  <div id="log"></div>

  <div class="row">
    <input id="msg" placeholder="Напиши что-нибудь..." />
    <button id="send">Send</button>
      <button id="close">close connection</button>
  </div>

  <script>
      const chat_id = "{{ chat_id }}"
  </script>
  <script src="{% static 'Chat/js/websocket.js' %}"></script>
</body>
</html>
